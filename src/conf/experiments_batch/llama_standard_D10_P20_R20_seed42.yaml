model:
  family: llama
  n_dims: 10
  n_positions: 101
  n_prompt: 20
  n_respond: 20
  n_embd: 256
  n_layer: 12
  n_head: 8
training:
  task: linear_regression
  data: gaussian
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0
  train_steps: 1000000
  save_every_steps: 20000
  w_type: gaussian
  num_tasks: null
  num_training_examples: null
  sequence_mode: sequential
  task_kwargs: {}
  log_interval: 200
  validation:
    batch_count: 50
    batch_size: 64
    seed: 1234
    eval_every_steps: 5000
  curriculum:
    dims:
      start: 10
      end: 10
      inc: 0
      interval: 10000000
    points:
      start: 20
      end: 20
      inc: 0
      interval: 10000000
  random_seed: 42
out_dir: ./outputs/batch_checkpoints/llama_standard_D10_P20_R20_seed42
wandb:
  log: true
  project: in-context-learning-prompt-respond
  name: llama_standard_D10_P20_R20_seed42
  group: llama_standard
  log_every_steps: 200
  notes: 'Standard experiment: LLAMA, D=10, P=20, R=20, seed=42'
  tags:
  - llama
  - standard
  - sequential
  - D10
  - P20
  - R20
  - seed42
evaluation:
  use_autoregressive_eval: true
