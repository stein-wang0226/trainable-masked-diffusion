# Config for Scatter Diffusion on Graphs (Path Len 10)
paradigm: "scatter"

model:
  n_layer: 12
  n_embd: 256
  n_head: 8
  n_positions: 256
  vocab_size: 128
  family: "scatter"
  diffusion_steps: 100

data:
  block_size: 4
  num_nodes: 100
  deg: 3
  path_len: 10
  # TODO: Replace with your actual data paths
  # train_data_path: "/path/to/your/graphs/deg_5_path_12_nodes_100_train_800000_rev.txt"
  # test_data_path: "/path/to/your/graphs/deg_5_path_12_nodes_100_test_80000_rev.txt"
  train_data_path: "/path/to/your/graphs/deg_3_path_10_nodes_100_train_800000.txt"
  test_data_path: "/path/to/your/graphs/deg_3_path_10_nodes_100_test_80000.txt"

training:
  batch_size: 64
  learning_rate: 2e-4
  max_steps: 500000
  warmup_steps: 1000
  save_every_steps: 5000
  eval_every_steps: 1000
  mixed_precision: "bf16"

wandb:
  project: "pathfinding-nebula-multi2"
  group: "graph-scatter"
  name: "scatter_deg3_len10_block4"
  entity: "your-wandb-entity"  # TODO: Replace with your wandb entity

# TODO: Replace with your desired output directory
out_dir: "./outputs/graph_scatter_310"
