# Config for Block Diffusion on Sudoku (Diff 1.0)
paradigm: "block"

model:
  n_layer: 12
  n_embd: 256
  n_head: 8
  n_positions: 256
  vocab_size: 12
  family: "block"
  diffusion_steps: 100

data:
  task: "sudoku"
  path_len: 81
  block_size: 4 # Logical block size for Sudoku
  train_data_path: "/path/to/your/sudoku/sudoku_train_300000_diff08.txt"
  test_data_path: "/path/to/your/sudoku/sudoku_test_30000_diff08.txt"

training:
  batch_size: 64
  learning_rate: 2e-4
  max_steps: 200000
  warmup_steps: 1000
  save_every_steps: 5000
  eval_every_steps: 1000
  mixed_precision: "bf16"

wandb:
  project: "sudoku-nebula-multi2"
  group: "sudoku-block"
  name: "block_sudoku_0.8_block4"
  entity: your-wandb-entity

out_dir: "/path/to/your/checkpoints/sudoku_block_0.8_block4"
