model:
  n_layer: 12
  n_embd: 256
  n_head: 8
  n_positions: 256
  vocab_size: 128
  family: "dream"
  diffusion_steps: 100

data:
  num_nodes: 100
  deg: 5
  path_len: 5
  # TODO: set to your local path for the path-finding training data
  train_data_path: "/path/to/your/graph_train.txt"
  # TODO: set to your local path for the path-finding test data
  test_data_path: "/path/to/your/graph_test.txt"

training:
  batch_size: 64
  learning_rate: 2e-4
  max_steps: 500000
  warmup_steps: 1000
  save_every_steps: 5000
  eval_every_steps: 1000
  mixed_precision: "bf16"

wandb:
  # TODO: fill in your own WandB project/entity if you want logging
  project: "your-wandb-project"
  group: "dream-scaling-study"
  name: "dream_deg5_len5"
  entity: "your-wandb-entity"

# TODO: set to your local directory for saving checkpoints
out_dir: "./outputs/pathfinding_dream_55"
