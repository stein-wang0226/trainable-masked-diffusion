model:
  n_layer: 12
  n_embd: 256
  n_head: 8
  n_positions: 256
  vocab_size: 12
  family: "qwen"

data:
  task: "sudoku"
  path_len: 81
  train_data_path: "/path/to/your/sudoku/sudoku_train_300000_diff06.txt"
  test_data_path: "/path/to/your/sudoku/sudoku_test_30000_diff06.txt"

training:
  batch_size: 64
  learning_rate: 2e-4
  max_steps: 500000
  warmup_steps: 1000
  save_every_steps: 5000
  eval_every_steps: 1000
  mixed_precision: "bf16"

wandb:
  project: "sudoku-final-submit"
  group: "qwen-sudoku"
  name: "qwen_sudoku_0.6"
  entity: your-wandb-entity

out_dir: "/path/to/your/sudoku_checkpoints_submit/sudoku_qwen_0.6"