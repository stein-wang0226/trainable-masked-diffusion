model:
  n_layer: 12
  n_embd: 256
  n_head: 8
  n_positions: 256
  vocab_size: 12
  family: "qwen"

data:
  task: "sudoku"
  path_len: 81
  # TODO: Replace with your actual data paths
  train_data_path: "/path/to/your/sudoku/sudoku_train_300000_diff10.txt"
  test_data_path: "/path/to/your/sudoku/sudoku_test_30000_diff10.txt"

training:
  batch_size: 64
  learning_rate: 2e-4
  max_steps: 500000
  warmup_steps: 1000
  save_every_steps: 5000
  eval_every_steps: 1000
  mixed_precision: "bf16"

wandb:
  project: "sudoku-final-submit"
  group: "qwen-sudoku"
  name: "qwen_sudoku_1.0"
  entity: "your-wandb-entity"  # TODO: Replace with your wandb entity

# TODO: Replace with your desired output directory
out_dir: "./outputs/sudoku_qwen_1.0"